[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bcb-econ-agent"
version = "0.1.0"
description = "AI agent that answers questions about Brazilian monetary policy using RAG over Copom documents and structured BCB indicators, built on Amazon Bedrock."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bruna Soares" }]
dependencies = [
    "anthropic>=2.7",
    "boto3>=1.34",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
econ-agent = "econ_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
